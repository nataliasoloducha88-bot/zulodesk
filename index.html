<style>
/* Layout: one-screen phone app — scrolling view area above a fixed two-tab bar (Aparat / Kolekcja). Stickers sit on a dotted album page. */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --ink: #161a24;
  --muted: #5d6578;
  --line: #d6dbe6;
  --accent: #2b59ff;
  --accent-ink: #ffffff;
  --gold: #ffcf3a;
  --danger: #d92d3a;
  --dot: #cdd3df;
  --font-display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11131a; --surface: #1b1e28; --ink: #eef0f6; --muted: #9aa2b5; --line: #2c3140;
    --accent: #6f8cff; --accent-ink: #0b0d14; --gold: #ffd75a; --danger: #ff6b74; --dot: #262a37;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11131a; --surface: #1b1e28; --ink: #eef0f6; --muted: #9aa2b5; --line: #2c3140;
  --accent: #6f8cff; --accent-ink: #0b0d14; --gold: #ffd75a; --danger: #ff6b74; --dot: #262a37;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px;
  display: flex; flex-direction: column; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, label:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }

header {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 10px;
}
h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; letter-spacing: -0.02em; }
h1 span { color: var(--accent); }
.counter { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-variant-numeric: tabular-nums; }
.counter b { color: var(--ink); font-size: 1rem; }

main { flex: 1; min-height: 0; overflow-y: auto; }
.view { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 4px 24px; display: flex; flex-direction: column; gap: 16px; }

/* Camera */
.viewfinder {
  position: relative; width: 100%; max-width: 100%; aspect-ratio: 3 / 4; max-height: 62vh; margin-inline: auto;
  border-radius: 22px; overflow: hidden; background: #000;
}
.viewfinder video, .viewfinder img { width: 100%; height: 100%; object-fit: cover; display: block; max-width: 100%; }
.reticle { position: absolute; inset: 8%; pointer-events: none; }
.reticle i { position: absolute; width: 34px; height: 34px; border: 4px solid rgba(255,255,255,0.85); }
.reticle i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 12px; }
.reticle i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 12px; }
.reticle i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 12px; }
.reticle i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 12px; }
#still { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ball {
  position: absolute; left: 50%; bottom: 18px; width: 76px; height: 76px; margin-left: -38px;
  touch-action: none; cursor: grab; z-index: 3; filter: drop-shadow(0 6px 8px rgba(0,0,0,0.45));
  border: 0; padding: 0; background: none; border-radius: 50%;
}
.ball svg { width: 100%; height: 100%; display: block; pointer-events: none; }
.ball.idle { animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 4; }
.burst { position: absolute; z-index: 5; font-family: var(--font-display); font-weight: 800; font-size: 2rem; color: #fff; text-shadow: 0 3px 0 var(--accent), 0 6px 14px rgba(0,0,0,0.5); left: 0; right: 0; text-align: center; pointer-events: none; }
.vf-empty { position: absolute; inset: 0; display: grid; place-content: center; gap: 8px; text-align: center; color: #c9cfdd; padding: 24px; }
.vf-empty strong { font-family: var(--font-display); font-size: 1.3rem; color: #fff; }

.controls { display: flex; align-items: center; justify-content: center; gap: 16px; }
.shutter {
  width: 78px; height: 78px; border-radius: 50%; border: 5px solid var(--ink); background: var(--accent);
  box-shadow: inset 0 0 0 5px var(--bg); display: grid; place-items: center;
}
.shutter:active { transform: scale(0.94); }
.side-btn {
  width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
  display: grid; place-items: center; position: relative;
}
.side-btn svg { width: 24px; height: 24px; }
.side-btn input, .shutter input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.hint { text-align: center; color: var(--muted); font-size: 0.9rem; margin: 0; max-width: 34ch; margin-inline: auto; }
.status { text-align: center; font-size: 0.85rem; color: var(--muted); min-height: 1.2em; margin: 0; }

/* Catch result */
.result { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.album {
  width: 100%; border-radius: 22px; padding: 24px 16px; display: grid; place-items: center;
  background-color: var(--surface); background-image: radial-gradient(var(--dot) 1.5px, transparent 1.6px); background-size: 18px 18px;
  border: 1px solid var(--line);
}
.album img { max-height: 46vh; max-width: 100%; animation: pop 0.5s cubic-bezier(.2,1.6,.4,1); filter: drop-shadow(0 6px 10px rgba(0,0,0,0.18)); }
@keyframes pop { from { transform: scale(0.4) rotate(-8deg); } to { transform: scale(1) rotate(0); } }
.caught { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; margin: 0; text-wrap: balance; text-align: center; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.tag { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; padding: 5px 10px; border-radius: 99px; background: var(--gold); color: #2a2100; font-weight: 700; }
.tag.alt { background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
.field { width: 100%; display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.field input {
  width: 100%; box-sizing: border-box; font: inherit; font-size: 1.1rem; padding: 14px 16px; border-radius: 14px;
  border: 2px solid var(--line); background: var(--surface); color: var(--ink);
}
.field input:focus { border-color: var(--accent); outline: none; }
.row { display: flex; gap: 12px; width: 100%; }
.btn { flex: 1; padding: 15px 18px; border-radius: 14px; border: 0; font-weight: 700; font-size: 1rem; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border: 2px solid var(--line); }
.btn.danger { background: var(--danger); color: #fff; }
.btn:disabled { opacity: 0.5; }

/* Collection */
.dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.card {
  display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 18px; border: 1px solid var(--line); text-align: left;
  background-color: var(--surface); background-image: radial-gradient(var(--dot) 1.2px, transparent 1.3px); background-size: 14px 14px;
}
.card .pic { aspect-ratio: 1; max-width: 100%; overflow: hidden; }
.card .pic img { width: 100%; height: 100%; object-fit: contain; display: block; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.15)); }
.card .no { font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0.06em; }
.card .nm { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; line-height: 1.15; overflow-wrap: anywhere; }
.empty { text-align: center; padding: 48px 16px; display: flex; flex-direction: column; gap: 10px; align-items: center; color: var(--muted); }
.empty strong { font-family: var(--font-display); font-size: 1.4rem; color: var(--ink); }
.empty .ghost-sil { width: 90px; height: 120px; color: var(--line); }

/* Detail sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(8,10,16,0.55); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 560px; background: var(--bg); border-radius: 24px 24px 0 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px calc(20px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px; max-height: 92%; overflow-y: auto; box-sizing: border-box;
}

nav {
  display: flex; border-top: 1px solid var(--line); background: var(--surface);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 6px calc(6px + env(safe-area-inset-bottom, 0px));
}
nav button { flex: 1; border: 0; background: none; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.78rem; font-weight: 700; color: var(--muted); border-radius: 12px; }
nav button svg { width: 26px; height: 26px; }
nav button[aria-selected="true"] { color: var(--accent); }

.spinner { width: 46px; height: 46px; border-radius: 50%; border: 5px solid var(--line); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .album img, .spinner { animation-duration: 0s; } }
</style>

<script type="module">
import { FilesetResolver, ImageSegmenter } from "./mp/vision_bundle.mjs";

const $ = (id) => document.getElementById(id);
const PERSON = 15; // klasa "person" w modelu DeepLab v3 (PASCAL VOC)
let segmenter = null;
let segReady = Promise.resolve();
let catches = [];
let stream = null;
let facing = "environment";
let pending = null;

/* ---------- Storage (IndexedDB, z zapasowym trybem w pamięci) ---------- */
const store = {
  db: null,
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open("zulodesk", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("catches", { keyPath: "id" });
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    } catch { this.db = null; }
  },
  tx(mode, fn) {
    if (!this.db) return Promise.resolve(null);
    return new Promise((res) => {
      try {
        const t = this.db.transaction("catches", mode);
        const req = fn(t.objectStore("catches"));
        t.oncomplete = () => res(req?.result ?? null);
        t.onerror = () => res(null);
      } catch { res(null); }
    });
  },
  all() { return this.tx("readonly", (s) => s.getAll()); },
  put(c) { return this.tx("readwrite", (s) => s.put(c)); },
  del(id) { return this.tx("readwrite", (s) => s.delete(id)); },
};

/* ---------- Wykrywanie osoby ---------- */
async function loadSegmenter() {
  try {
    const base = new URL("./mp", document.baseURI).href;
    const fileset = await FilesetResolver.forVisionTasks(base);
    // model DeepLab v3 (.tflite) leży pod rozszerzeniem .wasm, bo tylko takie pliki binarne serwuje hosting
    const model = new Uint8Array(await (await fetch(new URL("./mp/deeplab_v3_model.wasm", document.baseURI))).arrayBuffer());
    segmenter = await ImageSegmenter.createFromOptions(fileset, {
      baseOptions: { modelAssetBuffer: model, delegate: "CPU" },
      runningMode: "IMAGE",
      outputCategoryMask: false,
      outputConfidenceMasks: true,
    });
    setStatus("Gotowe do łapania.");
  } catch (e) {
    console.error(e);
    setStatus("Nie udało się załadować wykrywacza ludzi. Odśwież stronę.");
  }
}

function setStatus(t) { $("status").textContent = t; }

// Zwraca canvas z naklejką albo null, gdy na zdjęciu nie ma człowieka.
function makeSticker(source, sw, sh) {
  const scale = Math.min(1, 1024 / Math.max(sw, sh));
  const W = Math.round(sw * scale), H = Math.round(sh * scale);
  const work = document.createElement("canvas");
  work.width = W; work.height = H;
  const wctx = work.getContext("2d", { willReadFrequently: true });
  wctx.drawImage(source, 0, 0, W, H);

  const result = segmenter.segment(work);
  const mask = result.confidenceMasks[PERSON].getAsFloat32Array();
  const mw = result.confidenceMasks[PERSON].width, mh = result.confidenceMasks[PERSON].height;
  result.close();

  const img = wctx.getImageData(0, 0, W, H);
  const px = img.data;
  let minX = W, minY = H, maxX = -1, maxY = -1, count = 0;
  for (let y = 0; y < H; y++) {
    const my = Math.min(mh - 1, Math.floor(y * mh / H));
    for (let x = 0; x < W; x++) {
      const c = mask[my * mw + Math.min(mw - 1, Math.floor(x * mw / W))];
      const a = Math.max(0, Math.min(1, (c - 0.35) / 0.3)); // miękka krawędź
      px[(y * W + x) * 4 + 3] = Math.round(a * 255);
      if (a > 0.5) {
        count++;
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
  }
  if (count < W * H * 0.01) {
    // nikogo nie wykryto: i tak łapiemy, naklejką jest całe zdjęcie
    minX = 0; minY = 0; maxX = W - 1; maxY = H - 1;
  } else {
    wctx.putImageData(img, 0, 0);
  }

  const bw = maxX - minX + 1, bh = maxY - minY + 1;
  const border = Math.round(Math.max(bw, bh) * 0.035) + 4;
  const pad = border + 6;
  const cut = document.createElement("canvas");
  cut.width = bw; cut.height = bh;
  cut.getContext("2d").drawImage(work, minX, minY, bw, bh, 0, 0, bw, bh);

  // biała sylwetka do obrysu
  const white = document.createElement("canvas");
  white.width = bw; white.height = bh;
  const wh = white.getContext("2d");
  wh.drawImage(cut, 0, 0);
  wh.globalCompositeOperation = "source-in";
  wh.fillStyle = "#fff";
  wh.fillRect(0, 0, bw, bh);

  const out = document.createElement("canvas");
  out.width = bw + pad * 2; out.height = bh + pad * 2;
  const o = out.getContext("2d");
  for (let i = 0; i < 32; i++) {
    const t = (i / 32) * Math.PI * 2;
    o.drawImage(white, pad + Math.cos(t) * border, pad + Math.sin(t) * border);
  }
  o.drawImage(white, pad, pad);
  o.drawImage(cut, pad, pad);

  const ratio = bw / bh;
  const pose = ratio > 1.25 ? "leżąca" : ratio < 0.62 ? "stojąca" : "siedząca / inna";
  return { canvas: out, pose };
}

function toDataURL(canvas, max = 640) {
  const s = Math.min(1, max / Math.max(canvas.width, canvas.height));
  if (s === 1) return canvas.toDataURL("image/png");
  const c = document.createElement("canvas");
  c.width = Math.round(canvas.width * s); c.height = Math.round(canvas.height * s);
  const ctx = c.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(canvas, 0, 0, c.width, c.height);
  return c.toDataURL("image/png");
}

/* ---------- Aparat ---------- */
async function startCamera() {
  stopCamera();
  if (!navigator.mediaDevices?.getUserMedia) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false });
    const v = $("video");
    v.srcObject = stream;
    v.hidden = false;
    $("vfEmpty").hidden = true;
    $("flip").hidden = false;
    $("flipSpacer").hidden = true;
  } catch {
    stream = null; // brak dostępu: rzut kulą otwiera systemowy aparat
  }
}
function stopCamera() {
  stream?.getTracks().forEach((t) => t.stop());
  stream = null;
}

async function processSource(source, w, h) {
  await segReady;
  if (!segmenter) { showView("camera"); setStatus("Nie udało się załadować wykrywacza ludzi. Odśwież stronę."); return; }
  showView("result");
  $("resultBody").innerHTML = '<div class="spinner" role="status" aria-label="Szukam człowieka"></div><p class="hint">Szukam człowieka na zdjęciu…</p>';
  await new Promise((r) => setTimeout(r, 30));
  let made = null;
  try { made = makeSticker(source, w, h); } catch (e) { console.error(e); }
  if (!made) {
    $("resultBody").innerHTML = "";
    const b = el("button", "btn primary", "Wróć do aparatu");
    b.onclick = () => showView("camera");
    $("resultBody").append(el("p", "hint", "Coś poszło nie tak przy robieniu naklejki."), rowOf(b));
    return;
  }
  pending = { img: toDataURL(made.canvas), pose: made.pose };
  renderPending();
}

function renderPending() {
  const body = $("resultBody");
  body.innerHTML = "";
  const album = el("div", "album");
  const im = new Image(); im.src = pending.img; im.alt = "Nowa naklejka";
  album.append(im);
  const no = String(catches.length + 1).padStart(3, "0");
  const tags = el("div", "tags");
  tags.append(el("span", "tag", "Nr " + no), el("span", "tag alt", "Poza: " + pending.pose));
  const field = el("div", "field");
  const lab = el("label", "", "Podpis");
  lab.htmlFor = "nameInput";
  const inp = document.createElement("input");
  inp.id = "nameInput"; inp.placeholder = "Kto to jest?"; inp.maxLength = 40; inp.autocomplete = "off";
  field.append(lab, inp);
  const drop = el("button", "btn ghost", "Wypuść");
  const save = el("button", "btn primary", "Złap!");
  save.disabled = true;
  inp.oninput = () => (save.disabled = !inp.value.trim());
  inp.onkeydown = (e) => { if (e.key === "Enter" && inp.value.trim()) save.click(); };
  drop.onclick = () => { pending = null; showView("camera"); };
  save.onclick = async () => {
    const c = { id: Date.now().toString(36), no: catches.length ? Math.max(...catches.map((x) => x.no)) + 1 : 1, name: inp.value.trim(), pose: pending.pose, img: pending.img, at: Date.now() };
    catches.push(c);
    await store.put(c);
    pending = null;
    updateCount();
    showView("dex");
  };
  body.append(el("p", "caught", "Mamy go!"), album, tags, field, rowOf(drop, save));
  inp.focus();
}

/* ---------- Kolekcja ---------- */
function renderDex() {
  const grid = $("dex");
  grid.innerHTML = "";
  $("dexEmpty").hidden = catches.length > 0;
  [...catches].sort((a, b) => b.no - a.no).forEach((c) => {
    const card = el("button", "card");
    const pic = el("div", "pic");
    const im = new Image(); im.src = c.img; im.alt = c.name; im.loading = "lazy";
    pic.append(im);
    card.append(pic, el("span", "no", "NR " + String(c.no).padStart(3, "0")), el("span", "nm", c.name));
    card.onclick = () => openDetail(c);
    grid.append(card);
  });
}

function openDetail(c) {
  const s = $("sheet");
  s.innerHTML = "";
  const album = el("div", "album");
  const im = new Image(); im.src = c.img; im.alt = c.name;
  album.append(im);
  const tags = el("div", "tags");
  tags.append(el("span", "tag", "Nr " + String(c.no).padStart(3, "0")), el("span", "tag alt", "Poza: " + c.pose),
    el("span", "tag alt", new Date(c.at).toLocaleDateString("pl-PL", { day: "numeric", month: "short", year: "numeric" })));
  const close = el("button", "btn ghost", "Zamknij");
  const del = el("button", "btn ghost", "Usuń");
  close.onclick = closeSheet;
  del.onclick = () => {
    const sure = el("button", "btn danger", "Tak, usuń");
    const back = el("button", "btn ghost", "Anuluj");
    sure.onclick = async () => {
      catches = catches.filter((x) => x.id !== c.id);
      await store.del(c.id);
      updateCount(); renderDex(); closeSheet();
    };
    back.onclick = () => openDetail(c);
    actions.replaceWith(rowOf(back, sure));
  };
  const actions = rowOf(del, close);
  s.append(el("p", "caught", c.name), album, tags, actions);
  $("sheetBg").hidden = false;
}
function closeSheet() { $("sheetBg").hidden = true; }
$("sheetBg").onclick = (e) => { if (e.target === $("sheetBg")) closeSheet(); };

/* ---------- Pomocnicze ---------- */
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function rowOf(...kids) { const r = el("div", "row"); r.append(...kids); return r; }
function updateCount() { $("count").textContent = catches.length; }

function showView(name) {
  $("v-camera").hidden = name !== "camera";
  $("v-result").hidden = name !== "result";
  $("v-dex").hidden = name !== "dex";
  $("tabCamera").setAttribute("aria-selected", String(name !== "dex"));
  $("tabDex").setAttribute("aria-selected", String(name === "dex"));
  if (name === "dex") renderDex();
  if (name === "camera") resetBall();
  document.querySelector("main").scrollTop = 0;
}

/* ---------- Rzut kulą ---------- */
const ball = $("ball");
let drag = null;
let throwing = false;
let fileThrow = false; // rzut bez podglądu: najpierw systemowy aparat, potem animacja

function resetBall() {
  throwing = false;
  ball.getAnimations().forEach((a) => a.cancel());
  ball.style.transform = "";
  ball.style.visibility = "";
  ball.classList.add("idle");
  $("still").hidden = true;
  $("vf").querySelectorAll(".burst").forEach((b) => b.remove());
}

ball.addEventListener("pointerdown", (e) => {
  if (throwing) return;
  ball.setPointerCapture(e.pointerId);
  ball.classList.remove("idle");
  drag = { x: e.clientX, y: e.clientY, dx: 0, dy: 0 };
});
ball.addEventListener("pointermove", (e) => {
  if (!drag) return;
  drag.dx = e.clientX - drag.x;
  drag.dy = e.clientY - drag.y;
  ball.style.transform = `translate(${drag.dx}px, ${drag.dy}px) rotate(${drag.dx / 2}deg)`;
});
ball.addEventListener("pointerup", () => {
  if (!drag) return;
  const { dx, dy } = drag;
  drag = null;
  const tap = Math.hypot(dx, dy) < 8;
  if (dy < -40 || tap) throwBall(dx, dy);
  else resetBall();
});
ball.addEventListener("pointercancel", () => { drag = null; resetBall(); });
ball.addEventListener("click", (e) => e.preventDefault());
ball.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); throwBall(0, 0); } });

function throwBall(dx, dy) {
  throwing = true;
  if (stream) {
    const v = $("video");
    const snap = document.createElement("canvas");
    snap.width = v.videoWidth; snap.height = v.videoHeight;
    snap.getContext("2d").drawImage(v, 0, 0);
    showStill(snap);
    flyAndCatch(dx, dy).then(() => processSource(snap, snap.width, snap.height));
  } else {
    fileThrow = true;
    $("pickCamera").click(); // musi zostać wywołane w geście palca
    resetBall();
    throwing = true;
  }
}

function showStill(src) {
  const c = $("still");
  c.width = src.width; c.height = src.height;
  c.getContext("2d").drawImage(src, 0, 0);
  c.hidden = false;
}

// animacja może stanąć, gdy karta jest w tle; nie czekamy na nią w nieskończoność
const done = (anim, ms) => Promise.race([anim.finished, new Promise((r) => setTimeout(r, ms))]);

async function flyAndCatch(dx = 0, dy = 0) {
  const vf = $("vf").getBoundingClientRect();
  const b = ball.getBoundingClientRect();
  // cel: środek kadru, lekko powyżej połowy
  const tx = vf.left + vf.width / 2 - (b.left - dx + b.width / 2);
  const ty = vf.top + vf.height * 0.42 - (b.top - dy + b.height / 2);
  ball.classList.remove("idle");
  const fly = ball.animate([
    { transform: `translate(${dx}px, ${dy}px) rotate(0deg) scale(1)` },
    { transform: `translate(${tx * 0.5}px, ${ty * 0.75}px) rotate(400deg) scale(0.8)`, offset: 0.5 },
    { transform: `translate(${tx}px, ${ty}px) rotate(720deg) scale(0.55)` },
  ], { duration: 650, easing: "cubic-bezier(.25,.6,.4,1)", fill: "forwards" });
  await done(fly, 700);
  $("flash").animate([{ opacity: 0.95 }, { opacity: 0 }], { duration: 450, easing: "ease-out" });
  const at = `translate(${tx}px, ${ty}px) scale(0.55)`;
  const wobble = ball.animate([
    { transform: `${at} rotate(0deg)` }, { transform: `${at} rotate(-22deg)` }, { transform: `${at} rotate(18deg)` },
    { transform: `${at} rotate(-10deg)` }, { transform: `${at} rotate(0deg)` },
  ], { duration: 900, delay: 250, easing: "ease-in-out", fill: "forwards" });
  await done(wobble, 1200);
  fly.cancel();
  const burst = el("div", "burst", "Złapany!");
  burst.style.top = `calc(42% - 70px)`;
  $("vf").append(burst);
  burst.animate([{ transform: "scale(0.3)", opacity: 0 }, { transform: "scale(1.15)", opacity: 1, offset: 0.6 }, { transform: "scale(1)", opacity: 1 }], { duration: 450, easing: "ease-out", fill: "forwards" });
  await new Promise((r) => setTimeout(r, 700));
}

$("tabCamera").onclick = () => showView(pending ? "result" : "camera");
$("tabDex").onclick = () => showView("dex");

$("flip").onclick = () => { facing = facing === "environment" ? "user" : "environment"; startCamera(); };

async function handleFile(input) {
  const f = input.files?.[0];
  input.value = "";
  const animate = fileThrow;
  fileThrow = false;
  if (!f) { resetBall(); return; }
  try {
    const bmp = await createImageBitmap(f, { imageOrientation: "from-image" });
    if (animate) {
      showView("camera");
      showStill(bmp);
      throwing = true;
      await flyAndCatch();
    }
    processSource(bmp, bmp.width, bmp.height);
  } catch {
    resetBall();
    setStatus("Nie mogę otworzyć tego zdjęcia. Spróbuj innego.");
  }
}
$("pickCamera").onchange = (e) => handleFile(e.target);
$("pickGallery").onchange = (e) => handleFile(e.target);

/* ---------- Start ---------- */
(async () => {
  await store.open();
  catches = ((await store.all()) || []).sort((a, b) => a.no - b.no);
  updateCount();
  startCamera();
  segReady = loadSegmenter();
})();
</script>
